name: Quality checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Python requirements
        run: python -m pip install -r pokerist/requirements.txt
      - name: JavaScript tests
        run: npm test
      - name: Python syntax checks
        run: python -m compileall -q pokerist start_mirror.py
      - name: Python tests
        run: python -m unittest discover -s pokerist -p "test_*.py" -v
      - name: Offline glyph matcher microbenchmark
        run: python pokerist/benchmark_matcher.py
