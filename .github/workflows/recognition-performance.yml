name: Offline recognition performance
on:
  push:
    paths:
      - 'pokerist/**'
      - '.github/workflows/recognition-performance.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  synthetic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install OCR and dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y tesseract-ocr tesseract-ocr-eng
          python -m pip install -r pokerist/requirements.txt
      - name: Verify native OCR
        run: python -m unittest discover -s pokerist -p 'test_native_ocr.py' -v
      - name: Regular synthetic changes
        run: python pokerist/benchmark_synthetic.py --frames 120 --change-every 12 --output regular-throughput.json
      - name: Every-frame change stress
        run: python pokerist/benchmark_synthetic.py --frames 60 --change-every 1 --output stress-throughput.json
      - name: Publish measured results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: synthetic-recognition-throughput
          path: '*-throughput.json'
          if-no-files-found: warn
          retention-days: 14
